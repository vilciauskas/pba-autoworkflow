name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (core + thermo; force-field backends are optional and not installed)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test,thermo]"
      - name: Run tests
        run: pytest -q -k "not one_degree and not stays_cubic and not overlap"
